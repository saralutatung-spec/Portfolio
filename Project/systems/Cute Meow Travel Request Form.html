<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>差旅費申請與報銷系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) 用於匯出 Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts Inter & Fredoka / Cute Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            /* 滿滿可愛貓爪背景圖案 */
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 1.5px, transparent 1.5px), radial-gradient(#fbcfe8 1.5px, #fdf2f8 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }
        /* 列印樣式優化 */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white !important;
                color: black;
            }
            .shadow-xl, .shadow-2xl {
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen text-slate-700 pb-12 relative overflow-x-hidden">

    <!-- 浮動背景貓咪裝飾圖示 -->
    <div class="fixed top-12 left-6 text-pink-200/60 text-6xl pointer-events-none select-none no-print"><i class="fa-solid fa-cat"></i></div>
    <div class="fixed bottom-12 right-6 text-pink-200/60 text-7xl pointer-events-none select-none no-print"><i class="fa-solid fa-shield-cat"></i></div>
    <div class="fixed top-1/2 -left-8 text-pink-200/40 text-8xl -rotate-12 pointer-events-none select-none no-print"><i class="fa-solid fa-paw"></i></div>
    <div class="fixed top-1/3 right-8 text-pink-200/40 text-6xl rotate-45 pointer-events-none select-none no-print"><i class="fa-solid fa-paw"></i></div>

    <!-- 頂部導覽列 -->
    <header class="bg-gradient-to-r from-pink-500 via-rose-400 to-pink-500 text-white shadow-lg border-b-4 border-pink-300 no-print">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white text-pink-500 rounded-full flex items-center justify-center shadow-inner text-xl">
                    <i class="fa-solid fa-cat"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                        喵喵差旅費申請系統 <i class="fa-solid fa-heart text-xs text-pink-200"></i>
                    </h1>
                    <p class="text-xs text-pink-100 font-light">讓每一次報銷都充滿萌萌好心情～</p>
                </div>
            </div>
            <div class="flex items-center space-x-3 text-sm">
                <button onclick="resetForm()" class="px-3.5 py-1.5 bg-white/20 hover:bg-white/30 text-white font-medium rounded-full backdrop-blur-md transition duration-200 flex items-center gap-1.5 border border-white/30">
                    <i class="fa-solid fa-rotate-left"></i> 重置表單
                </button>
                <button onclick="window.print()" class="px-3.5 py-1.5 bg-white text-pink-600 hover:bg-pink-50 font-bold rounded-full transition duration-200 flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-print"></i> 列印 / PDF
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto mt-8 px-4 relative z-10">
        
        <!-- 表單卡片容器 -->
        <div class="bg-white/95 backdrop-blur-sm rounded-3xl shadow-2xl border-2 border-pink-100 overflow-hidden">
            
            <!-- 表單標頭區 -->
            <div class="bg-gradient-to-r from-pink-100/90 via-rose-50/80 to-pink-100/90 p-6 md:p-8 border-b-2 border-pink-200/60 relative">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <div class="inline-flex items-center gap-2 px-3 py-1 bg-pink-200/60 text-pink-700 text-xs font-bold rounded-full mb-2">
                            <i class="fa-solid fa-paw"></i> 萌貓陪你算帳
                        </div>
                        <h2 class="text-2xl md:text-3xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                            差旅費報銷申請單
                        </h2>
                        <p class="text-slate-500 text-sm mt-1">請填寫出差資訊與費用明細，完成後可一鍵下載可愛整齊的 Excel 檔。</p>
                    </div>
                    <div class="bg-white/90 backdrop-blur px-4 py-2.5 rounded-2xl border-2 border-pink-200 shadow-sm text-right relative">
                        <i class="fa-solid fa-fish text-pink-300 absolute -top-2 -left-2 text-lg"></i>
                        <span class="text-xs font-bold text-pink-400 block uppercase tracking-wider">申請單號</span>
                        <span id="formNo" class="text-lg font-mono font-bold text-pink-600">MEOW-20261101</span>
                    </div>
                </div>
            </div>

            <!-- 主表單 -->
            <form id="expenseForm" class="p-6 md:p-8 space-y-8" onsubmit="event.preventDefault();">
                
                <!-- 區塊一：申請人基本資料 -->
                <div>
                    <h3 class="text-lg font-extrabold text-slate-800 mb-4 flex items-center gap-2 border-l-4 border-pink-400 pl-3">
                        <i class="fa-solid fa-paw text-pink-500"></i> 1. 貓奴主子基本資料
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">出差人員 <span class="text-rose-400">*</span></label>
                            <input type="text" id="applicantName" required placeholder="例：貓奴王小明" 
                                class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">所屬部門 <span class="text-rose-400">*</span></label>
                            <input type="text" id="department" required placeholder="例：抓抓事業部" 
                                class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">員工編號</label>
                            <input type="text" id="employeeId" placeholder="例：MEOW-8801" 
                                class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium">
                        </div>
                    </div>
                </div>

                <!-- 區塊二：差旅行程資訊 -->
                <div>
                    <h3 class="text-lg font-extrabold text-slate-800 mb-4 flex items-center gap-2 border-l-4 border-pink-400 pl-3">
                        <i class="fa-solid fa-map-location-dot text-pink-500"></i> 2. 出差腳印與任務
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">出差地點 <span class="text-rose-400">*</span></label>
                            <input type="text" id="destination" required placeholder="例：東京 / 高雄" 
                                class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">開始日期 <span class="text-rose-400">*</span></label>
                            <input type="date" id="startDate" required 
                                class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">結束日期 <span class="text-rose-400">*</span></label>
                            <input type="date" id="endDate" required 
                                class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">貨幣類別</label>
                            <select id="currency" onchange="updateCurrencySymbol()" 
                                class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium">
                                <option value="TWD">TWD (新台幣)</option>
                                <option value="USD">USD (美金)</option>
                                <option value="JPY">JPY (日圓)</option>
                                <option value="EUR">EUR (歐元)</option>
                                <option value="RMB">RMB (人民幣)</option>
                            </select>
                        </div>
                        <div class="md:col-span-2 lg:col-span-4">
                            <label class="block text-sm font-bold text-slate-700 mb-1.5">出差事由 / 罐罐任務 <span class="text-rose-400">*</span></label>
                            <input type="text" id="purpose" required placeholder="例：拜訪客戶洽談專案與參與展覽" 
                                class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium">
                        </div>
                    </div>
                </div>

                <!-- 區塊三：費用明細動態表格 -->
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-extrabold text-slate-800 flex items-center gap-2 border-l-4 border-pink-400 pl-3">
                            <i class="fa-solid fa-receipt text-pink-500"></i> 3. 費用罐罐記帳簿
                        </h3>
                        <button type="button" onclick="addExpenseRow()" 
                            class="px-4 py-2 bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold rounded-2xl transition duration-150 text-sm flex items-center gap-2 border border-pink-200 shadow-sm">
                            <i class="fa-solid fa-plus-circle text-pink-500"></i> 新增費用項目
                        </button>
                    </div>

                    <div class="overflow-x-auto rounded-2xl border-2 border-pink-100 shadow-sm bg-white">
                        <table class="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr class="bg-gradient-to-r from-pink-50 to-rose-50 text-slate-700 text-xs font-bold tracking-wider uppercase border-b-2 border-pink-100">
                                    <th class="p-3.5 w-36">消費日期</th>
                                    <th class="p-3.5 w-40">費用類別</th>
                                    <th class="p-3.5">說明 / 憑證備註</th>
                                    <th class="p-3.5 w-36">金額 (<span class="currency-label">NT$</span>)</th>
                                    <th class="p-3.5 w-32">發票/單據</th>
                                    <th class="p-3.5 w-16 text-center no-print">操作</th>
                                </tr>
                            </thead>
                            <tbody id="expenseTableBody" class="divide-y divide-pink-100 text-sm">
                                <!-- 動態插入行 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 區塊四：統計總額與備註 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start pt-2">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1.5">其他說明 / 備註</label>
                        <textarea id="remarks" rows="3" placeholder="例如：若有預借款請在此備註，或填寫發票遺失說明喵..." 
                            class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/30 border-2 border-pink-100 focus:bg-white focus:border-pink-400 focus:outline-none transition text-sm font-medium"></textarea>
                    </div>

                    <div class="bg-gradient-to-br from-pink-50 to-rose-100/60 p-6 rounded-3xl border-2 border-pink-200/80 flex flex-col justify-between relative overflow-hidden">
                        <i class="fa-solid fa-cat text-pink-200/50 text-8xl absolute -right-3 -bottom-3 pointer-events-none"></i>
                        <div class="flex justify-between items-center relative z-10">
                            <span class="text-sm font-bold text-slate-600 flex items-center gap-1.5">
                                <i class="fa-solid fa-list-check text-pink-400"></i> 費用項目總筆數：
                            </span>
                            <span id="itemCount" class="font-extrabold text-pink-700 bg-white px-3 py-0.5 rounded-full text-sm shadow-sm">0 筆</span>
                        </div>
                        <div class="flex justify-between items-center my-3 border-t border-pink-200/60 pt-3 relative z-10">
                            <span class="text-base font-extrabold text-slate-700">總報銷金額：</span>
                            <div class="text-right">
                                <span class="currency-label text-xl font-bold text-pink-500 mr-1">NT$</span>
                                <span id="totalAmount" class="text-3xl font-black text-pink-600">0</span>
                            </div>
                        </div>
                        <p class="text-xs text-pink-400 text-right font-medium relative z-10">🐾 貓咪計算機精確加總中</p>
                    </div>
                </div>

                <!-- 簽核與送出按鈕區 -->
                <div class="pt-6 border-t-2 border-pink-100">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="text-xs text-slate-500 flex items-center gap-2 bg-pink-50/80 px-4 py-2 rounded-2xl border border-pink-100">
                            <i class="fa-solid fa-heart text-pink-500 text-base"></i>
                            <span>資料填寫完成後，點擊右側按鈕匯出萌萌的 Excel 報表！</span>
                        </div>
                        <div class="flex gap-3 w-full sm:w-auto">
                            <button type="button" onclick="exportToExcel()" 
                                class="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-extrabold rounded-2xl shadow-lg shadow-pink-500/25 transition duration-200 flex items-center justify-center gap-2 text-base">
                                <i class="fa-solid fa-file-excel text-xl"></i> 匯出 Excel 報表
                            </button>
                        </div>
                    </div>
                </div>

            </form>
        </div>

        <!-- 萌貓溫馨提示 -->
        <div class="mt-6 text-center text-xs text-pink-400 font-medium flex items-center justify-center gap-1.5 no-print">
            <i class="fa-solid fa-paw"></i> 祝您差旅順利，早點回家擼貓！ <i class="fa-solid fa-paw"></i>
        </div>

        <!-- 提示訊息 Modal -->
        <div id="toast" class="fixed bottom-6 right-6 bg-slate-800/90 text-white px-5 py-3.5 rounded-2xl shadow-2xl transition duration-300 opacity-0 pointer-events-none flex items-center gap-3 backdrop-blur-md z-50">
            <i id="toastIcon" class="fa-solid fa-circle-check text-pink-400 text-lg"></i>
            <span id="toastMsg" class="font-medium">訊息通知</span>
        </div>

    </main>

    <script>
        // 初始化預設資料與事件監聽
        document.addEventListener('DOMContentLoaded', () => {
            // 設定預設日期為今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;

            // 預設新增三行明細
            addExpenseRow('交通費', '高鐵/計程車費', 1200);
            addExpenseRow('住宿費', '飯店住宿 1 晚', 2500);
            addExpenseRow('餐膳費', '出差餐費', 600);

            // 更新匯率標籤
            updateCurrencySymbol();
        });

        // 動態新增費用項目行
        function addExpenseRow(defaultCategory = '交通費', defaultDesc = '', defaultAmount = '') {
            const tbody = document.getElementById('expenseTableBody');
            const rowId = 'row_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const today = new Date().toISOString().split('T')[0];

            const tr = document.createElement('tr');
            tr.id = rowId;
            tr.className = "hover:bg-pink-50/50 transition duration-150";

            tr.innerHTML = `
                <td class="p-2.5">
                    <input type="date" value="${today}" class="expense-date w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-pink-400 focus:outline-none text-xs font-medium">
                </td>
                <td class="p-2.5">
                    <select class="expense-category w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-pink-400 focus:outline-none text-xs font-medium bg-white">
                        <option value="交通費" ${defaultCategory==='交通費'?'selected':''}>🚗 交通費</option>
                        <option value="住宿費" ${defaultCategory==='住宿費'?'selected':''}>🏨 住宿費</option>
                        <option value="餐膳費" ${defaultCategory==='餐膳費'?'selected':''}>🍱 餐膳費</option>
                        <option value="交際應酬費" ${defaultCategory==='交際應酬費'?'selected':''}>🤝 交際應酬費</option>
                        <option value="雜項支出" ${defaultCategory==='雜項支出'?'selected':''}>🛒 雜項支出</option>
                    </select>
                </td>
                <td class="p-2.5">
                    <input type="text" value="${defaultDesc}" placeholder="說明備註" class="expense-desc w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-pink-400 focus:outline-none text-xs font-medium">
                </td>
                <td class="p-2.5">
                    <input type="number" min="0" value="${defaultAmount}" placeholder="0" oninput="calculateTotal()" class="expense-amount w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-pink-400 focus:outline-none text-xs font-bold text-right text-pink-600">
                </td>
                <td class="p-2.5">
                    <select class="expense-receipt w-full px-3 py-1.5 rounded-xl border border-pink-200 focus:border-pink-400 focus:outline-none text-xs font-medium bg-white">
                        <option value="有發票/收據">有發票/收據</option>
                        <option value="免用統一發票">免用統一發票</option>
                        <option value="無單據">無單據</option>
                    </select>
                </td>
                <td class="p-2.5 text-center no-print">
                    <button type="button" onclick="removeRow('${rowId}')" class="text-rose-400 hover:text-rose-600 hover:bg-rose-50 p-1.5 rounded-xl transition">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
            calculateTotal();
        }

        // 刪除費用項目行
        function removeRow(rowId) {
            const tbody = document.getElementById('expenseTableBody');
            if (tbody.children.length <= 1) {
                showToast("喵！至少要留一筆費用項目喔～", "error");
                return;
            }
            const row = document.getElementById(rowId);
            if (row) {
                row.remove();
                calculateTotal();
            }
        }

        // 計算總金額
        function calculateTotal() {
            const amountInputs = document.querySelectorAll('.expense-amount');
            let total = 0;
            let count = 0;

            amountInputs.forEach(input => {
                const val = parseFloat(input.value);
                if (!isNaN(val) && val > 0) {
                    total += val;
                    count++;
                }
            });

            document.getElementById('totalAmount').textContent = total.toLocaleString('zh-TW');
            document.getElementById('itemCount').textContent = count + ' 筆';
        }

        // 更新貨幣符號
        function updateCurrencySymbol() {
            const currency = document.getElementById('currency').value;
            const symbols = {
                'TWD': 'NT$',
                'USD': '$',
                'JPY': '¥',
                'EUR': '€',
                'RMB': '¥'
            };
            const symbol = symbols[currency] || '$';
            document.querySelectorAll('.currency-label').forEach(el => {
                el.textContent = symbol;
            });
        }

        // 重置表單
        function resetForm() {
            if (confirm("喵？確定要清空所有填好的內容嗎？")) {
                document.getElementById('expenseForm').reset();
                document.getElementById('expenseTableBody').innerHTML = '';
                addExpenseRow('交通費', '', '');
                calculateTotal();
                showToast("表單已重置喵～", "info");
            }
        }

        // 顯示通知訊息
        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;
            
            if (type === "error") {
                toastIcon.className = "fa-solid fa-cat text-rose-400 text-lg";
            } else if (type === "info") {
                toastIcon.className = "fa-solid fa-circle-info text-pink-300 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-paw text-pink-400 text-lg";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // 匯出 Excel 功能 (使用 SheetJS)
        function exportToExcel() {
            // 基本欄位驗證
            const applicantName = document.getElementById('applicantName').value.trim();
            const department = document.getElementById('department').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const purpose = document.getElementById('purpose').value.trim();

            if (!applicantName || !department || !destination || !purpose) {
                showToast("喵！請記得填寫申請人資料與出差事由喔！", "error");
                return;
            }

            const formNo = document.getElementById('formNo').textContent;
            const employeeId = document.getElementById('employeeId').value || '未提供';
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const currency = document.getElementById('currency').value;
            const remarks = document.getElementById('remarks').value || '無';

            // 準備報表 Excel 內容結構
            const excelData = [
                ["差旅費報銷申請單 (喵喵版)", "", "", "", "", ""], 
                ["單號：", formNo, "", "申請日期：", new Date().toISOString().split('T')[0], ""],
                ["", "", "", "", "", ""],
                ["【申請人資訊】", "", "", "", "", ""],
                ["出差人員", applicantName, "部門", department, "員工編號", employeeId],
                ["出差地點", destination, "出差期間", `${startDate} 至 ${endDate}`, "計價幣別", currency],
                ["出差事由", purpose, "", "", "", ""],
                ["", "", "", "", "", ""],
                ["【費用明細項】", "", "", "", "", ""],
                ["消費日期", "費用類別", "說明/憑證備註", `金額 (${currency})`, "發票/單據狀態", "項次"]
            ];

            // 抓取費用表格資料
            const rows = document.querySelectorAll('#expenseTableBody tr');
            let grandTotal = 0;
            let itemIndex = 1;

            rows.forEach((row) => {
                const date = row.querySelector('.expense-date').value;
                let category = row.querySelector('.expense-category').value;
                // 去除 emoji 圖示僅保留文字
                category = category.replace(/[\u{1F300}-\u{1F6FF}\u{2600}-\u{26FF}]/gu, '').trim();
                
                const desc = row.querySelector('.expense-desc').value;
                const amount = parseFloat(row.querySelector('.expense-amount').value) || 0;
                const receipt = row.querySelector('.expense-receipt').value;

                grandTotal += amount;

                excelData.push([
                    date,
                    category,
                    desc,
                    amount,
                    receipt,
                    itemIndex++
                ]);
            });

            // 結算與簽核欄位
            excelData.push(["", "", "", "", "", ""]);
            excelData.push(["", "", "總計金額：", grandTotal, "", ""]);
            excelData.push(["其他備註：", remarks, "", "", "", ""]);
            excelData.push(["", "", "", "", "", ""]);
            excelData.push(["【簽核紀錄】", "", "", "", "", ""]);
            excelData.push(["申請人簽章", "", "部門主管審核", "", "財務審核", ""]);
            excelData.push(["", "", "", "", "", ""]);

            // 建立 工作表 (Worksheet)
            const ws = XLSX.utils.aoa_to_sheet(excelData);

            // 設定欄寬 Auto width
            ws['!cols'] = [
                { wch: 15 },
                { wch: 15 },
                { wch: 30 },
                { wch: 15 },
                { wch: 18 },
                { wch: 10 }
            ];

            // 合併單元格標題與區塊
            ws['!merges'] = [
                { s: { r: 0, c: 0 }, e: { r: 0, c: 5 } },
                { s: { r: 6, c: 1 }, e: { r: 6, c: 5 } },
                { s: { r: 12 + rows.length, c: 1 }, e: { r: 12 + rows.length, c: 5 } }
            ];

            // 建立 工作簿 (Workbook)
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "差旅費報銷單");

            // 導出檔案
            const fileName = `差旅費申請單_${applicantName}_${startDate}.xlsx`;
            XLSX.writeFile(wb, fileName);

            showToast("喵！Excel 報表匯出成功囉！");
        }
    </script>
</body>
</html>
