    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background: radial-gradient(circle at 50% 20%, #FFF5F7 0%, #FCE8EE 40%, #E8D5DD 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating Rose Petals Animation */
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            border-radius: 15px 0 15px 0;
            opacity: 0.6;
            pointer-events: none;
            animation: animatePetal 10s linear infinite;
        }

        @keyframes animatePetal {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Custom Rose Button Styles */
        .btn-rose {
            background: linear-gradient(135deg, #FFF0F3 0%, #FFCCD7 50%, #F4A261 100%);
            border: 2px solid #E6A4B4;
            color: #6B2D5C;
            box-shadow: 0 4px 15px rgba(230, 57, 99, 0.15), inset 0 0 8px rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-rose:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 25px rgba(230, 57, 99, 0.3), inset 0 0 12px rgba(255, 255, 255, 0.9);
            border-color: #E63963;
            color: #8B0032;
        }

        .btn-rose-active {
            background: linear-gradient(135deg, #E63963 0%, #C82D54 50%, #8B0032 100%) !important;
            border-color: #FFCCD7 !important;
            color: #FFFFFF !important;
            box-shadow: 0 6px 20px rgba(230, 57, 99, 0.4), inset 0 0 10px rgba(255, 204, 215, 0.5) !important;
        }

        /* 3D Card Flip styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            box-shadow: 0 8px 20px -4px rgba(109, 89, 122, 0.2);
        }

        .card-back {
            background-size: cover;
            background-position: center;
            border: 3px solid #FFF0F3;
        }

        .card-front {
            transform: rotateY(180deg);
            background: rgba(255, 253, 250, 0.97);
            border: 2px solid #F5C6D0;
        }

        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .animate-float {
            animation: subtleFloat 4s ease-in-out infinite;
        }
    </style>
</head>

            {

                love: '收到令人動心的浪漫告白或驚喜邀約，感情世界充滿詩意。',

            },
            {
                id: 'emperor',
                name: '皇帝 (牡丹花精靈)',
                englishName: 'The Emperor',
                numeral: 'IV',
                fairyFlower: '國色牡丹精靈',
                keywords: ['穩健護航', '權威秩序', '堅定基石', '責任與榮耀'],
                svgColor: { bg: '#FFF1F2', primary: '#E11D48', secondary: '#FECDD3' },
                summary: '牡丹花精靈展現雍容華貴的王權氣度，為你建立穩固的庇護所，帶來條理與強大依靠。',
                love: '給予安定可靠的承諾，感情關係堅實且充滿安全感。',
                career: '建立結構與明確目標，發揮領導才能，掌控全局走向成功。',
                svgIcon: `
                    <polygon points="75,80 85,55 100,70 115,55 125,80" fill="#FBBF24" stroke="#B45309" stroke-width="3"/>
                    <rect x="70" y="85" width="60" height="70" rx="6" fill="#FECDD3" stroke="#E11D48" stroke-width="3"/>
                `
            }
        ];

        // ... existing code ...
        let currentSpread = 'three';
        let currentDeck = [];
        let revealedCardState = [];

        window.addEventListener('DOMContentLoaded', () => {
            selectSpread('three');
        });

        function selectSpread(mode) {
            currentSpread = mode;
            
            document.querySelectorAll('.spread-btn').forEach(btn => {
                btn.classList.remove('btn-rose-active');
            });
            const activeBtn = document.getElementById(`btn-${mode}`);
            if (activeBtn) {
                activeBtn.classList.add('btn-rose-active');
            }

            document.getElementById('reading-section').classList.add('hidden');
            shuffleAndReset();
        }

        function shuffleAndReset() {
            document.getElementById('reading-section').classList.add('hidden');
            let shuffled = [...TAROT_CARDS].sort(() => Math.random() - 0.5);

            let count = 3;
            if (currentSpread === 'single') count = 1;
            if (currentSpread === 'all') count = 5;

            currentDeck = shuffled.slice(0, count);
            revealedCardState = new Array(count).fill(false);

            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            const spreadTitles = {
                'single': ['🌹 今日花語指引'],
                'three': ['🌸 過去 (Past)', '🌸 現在 (Present)', '🌸 未來 (Future)'],
                'all': ['向日葵 (光明)', '粉玫瑰 (情感)', '水仙 (希望)', '藍風鈴 (機會)', '牡丹 (強大)']
            };

            // Dynamic width per card count to prevent oversized cards
            let cardDimensionClass = "w-32 h-52 sm:w-36 sm:h-60"; // 5 cards size
            if (currentSpread === 'single') cardDimensionClass = "w-44 h-72 sm:w-48 sm:h-80";
            if (currentSpread === 'three') cardDimensionClass = "w-36 h-60 sm:w-40 sm:h-68";

            currentDeck.forEach((card, index) => {
                const cardSlot = document.createElement('div');
                cardSlot.className = 'flex flex-col items-center animate-float';
                cardSlot.style.animationDelay = `${index * 0.2}s`;

                let positionLabel = (currentSpread === 'three') 
                    ? spreadTitles['three'][index] 
                    : ((currentSpread === 'single') ? spreadTitles['single'][0] : `花語 ${index + 1}`);

                cardSlot.innerHTML = `
                    <div class="text-[10px] font-bold text-rose-900 mb-1.5 tracking-wider bg-white/80 px-2.5 py-0.5 rounded-full border border-pink-200 shadow-xs flex items-center gap-1">
                        ${positionLabel}
                    </div>
                    <div class="${cardDimensionClass} perspective-1000 cursor-pointer group" onclick="revealCard(${index})">
                        <div id="card-inner-${index}" class="card-inner">
                            <!-- Card Back -->
                            <div class="card-back overflow-hidden relative flex flex-col justify-between p-2 rounded-xl shadow-lg border-2 border-white" style="background-image: url('${CARD_BACK_URL}');">
                                <div class="absolute inset-0 bg-rose-950/10 group-hover:bg-transparent transition-colors"></div>
                                <div class="relative z-10 w-full h-full border border-white/50 rounded-lg flex flex-col justify-between p-1.5 pointer-events-none">
                                    <div class="text-white text-[9px] tracking-widest text-center font-serif opacity-90">🌸 Flower Fairy 🌸</div>
                                    <div class="text-center text-white drop-shadow-sm">
                                        <span class="text-lg sm:text-xl animate-pulse">🌹</span>
                                    </div>
                                    <div class="text-white text-[9px] tracking-widest text-center font-serif opacity-90">✦ Tarot ✦</div>
                                </div>
                            </div>

                            <!-- Card Front -->
                            <div class="card-front rounded-xl p-2.5 flex flex-col justify-between text-center overflow-hidden" style="background: linear-gradient(180deg, ${card.svgColor.bg} 0%, #FFFFFF 100%);">
                                <div class="flex justify-between items-center text-rose-900/60 font-serif text-[10px] font-bold border-b border-pink-100 pb-0.5">
                                    <span>${card.numeral}</span>
                                    <span class="truncate max-w-[75px]">${card.englishName}</span>
                                </div>
                                
                                <div class="my-auto py-1 flex justify-center items-center">
                                    <svg viewBox="0 0 200 220" class="w-20 h-20 sm:w-24 sm:h-24 drop-shadow-sm">
                                        ${card.svgIcon}
                                    </svg>
                                </div>

                                <div>
                                    <div class="text-[9px] text-rose-600 font-bold mb-0.5">${card.fairyFlower}</div>
                                    <h3 class="text-xs sm:text-sm font-bold text-stone-800 tracking-wide">${card.name}</h3>
                                    <div class="flex flex-wrap justify-center gap-0.5 mt-1">
                                        ${card.keywords.slice(0, 2).map(kw => `<span class="text-[9px] bg-rose-100/80 text-rose-800 px-1.5 py-0.2 rounded-full border border-rose-200">${kw}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(cardSlot);
            });
        }

        function revealCard(index) {
            const cardInner = document.getElementById(`card-inner-${index}`);
            if (!cardInner) return;

            if (!revealedCardState[index]) {
                cardInner.classList.add('flipped');
                revealedCardState[index] = true;
            }

            if (revealedCardState.every(state => state === true)) {
                setTimeout(() => {
                    showReadingResults();
                }, 600);
            }
        }

        function showReadingResults() {
            const readingSection = document.getElementById('reading-section');
            const readingDetails = document.getElementById('reading-details');
            const summaryTag = document.getElementById('reading-summary-tag');

            const tagMap = {
                'single': '🌹 玫瑰單牌指引',
                'three': '🌸 三花盛開陣解析',
                'all': '💐 五精靈全牌解析'
            };
            summaryTag.innerText = tagMap[currentSpread] || '花精靈解讀';

            if (currentSpread === 'single') {
                readingDetails.className = 'grid grid-cols-1 max-w-xl mx-auto gap-6';
            } else if (currentSpread === 'three') {
                readingDetails.className = 'grid grid-cols-1 md:grid-cols-3 gap-6';
            } else {
                readingDetails.className = 'grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4';
            }

            const positionTitles = {
                'single': ['今日花語指引'],
                'three': ['過去花根 (Past)', '現狀綻放 (Present)', '結實未來 (Future)'],
                'all': ['向日葵精靈', '粉玫瑰精靈', '水仙精靈', '藍風鈴精靈', '牡丹精靈']
            };

            readingDetails.innerHTML = currentDeck.map((card, idx) => `
                <div class="bg-white/90 rounded-2xl p-5 border border-pink-200/80 shadow-md flex flex-col justify-between hover:shadow-lg transition-all">
                    <div>
                        <div class="text-xs font-bold text-rose-800 bg-rose-100/70 border border-rose-200 px-3 py-1 rounded-full inline-block mb-2">
                            ${positionTitles[currentSpread][idx] || `位置 ${idx+1}`}
                        </div>
                        <h4 class="text-lg font-bold text-stone-800 flex items-center justify-between">
                            <span>${card.name}</span>
                            <span class="text-xs font-serif text-rose-400">${card.numeral}</span>
                        </h4>
                        <div class="text-xs text-rose-600 font-semibold mt-0.5">${card.fairyFlower}</div>
                        
                        <div class="flex flex-wrap gap-1 my-2.5">
                            ${card.keywords.map(k => `<span class="text-[10px] bg-pink-50 text-rose-700 px-2 py-0.5 rounded-full border border-pink-100">#${k}</span>`).join('')}
                        </div>
                        
                        <p class="text-xs text-stone-600 leading-relaxed mt-3 border-t border-pink-100 pt-3">
                            ${card.summary}
                        </p>
                    </div>

                    <div class="mt-4 pt-3 border-t border-pink-100 text-[11px] text-stone-600 space-y-2">
                        <div class="flex items-start gap-1.5">
                            <span class="text-rose-500">🌸</span>
                            <span><strong>愛情花語：</strong>${card.love}</span>
                        </div>
                        <div class="flex items-start gap-1.5">
                            <span class="text-amber-500">🌿</span>
                            <span><strong>事業花語：</strong>${card.career}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            readingSection.classList.remove('hidden');
            readingSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
